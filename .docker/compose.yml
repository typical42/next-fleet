# The dev stack described in docs/development.md#local-dev-environment.
#
#   docker compose up -d
#   docker compose exec -u www-data app php occ app:enable nextfleet
#
# Credentials here are deliberately trivial: nothing in this file is reachable from
# outside the machine and none of it is a template for a deployment.

name: nextfleet

# The bind mount leaves custom_apps owned by root and NC 31 refuses to install; the image's
# hooks run as www-data and cannot chown (docs/development.md#local-dev-environment).
x-custom-apps-owner: &fix-custom-apps-owner
  entrypoint:
    - /bin/sh
    - -c
    - chown www-data:www-data /var/www/html/custom_apps && exec /entrypoint.sh apache2-foreground

# Apache answers even when the install failed; only status.php says whether Nextcloud is
# installed, and `docker compose up --wait` reads it (docs/development.md#testing).
x-nextcloud-health: &nextcloud-health
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost/status.php | grep -q '\"installed\":true'"]
    interval: 10s
    timeout: 5s
    # The first start installs the database, which is minutes on a cold runner.
    retries: 60
    start_period: 30s

x-nextcloud-env: &nextcloud-env
  MYSQL_HOST: db
  MYSQL_USER: nextcloud
  MYSQL_PASSWORD: nextcloud
  # Nextcloud refuses the request unless the host it is reached on is trusted.
  NEXTCLOUD_TRUSTED_DOMAINS: localhost
  NEXTCLOUD_ADMIN_USER: admin
  NEXTCLOUD_ADMIN_PASSWORD: admin
  SMTP_HOST: mail
  SMTP_PORT: 1025
  MAIL_FROM_ADDRESS: nextfleet
  MAIL_DOMAIN: example.org

services:
  db:
    image: mariadb:11
    # Nextcloud's own requirement; the default REPEATABLE-READ deadlocks its file cache.
    command: --transaction-isolation=READ-COMMITTED --log-bin --binlog-format=ROW
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: nextcloud
      MARIADB_USER: nextcloud
      MARIADB_PASSWORD: nextcloud
    volumes:
      - db:/var/lib/mysql
      # The image creates one database; the second major needs its own schema.
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    image: nextcloud:34-apache
    <<: [*fix-custom-apps-owner, *nextcloud-health]
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      <<: *nextcloud-env
      MYSQL_DATABASE: nextcloud
    volumes:
      - app_html:/var/www/html
      # Edit in WSL, reload the browser.
      - ..:/var/www/html/custom_apps/nextfleet
    depends_on:
      db:
        condition: service_healthy

  # The oldest supported major, to catch a component that exists in 34 and not in 31. Its own
  # database and html volume: two majors cannot share one install.
  app31:
    image: nextcloud:31-apache
    <<: [*fix-custom-apps-owner, *nextcloud-health]
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      <<: *nextcloud-env
      MYSQL_DATABASE: nextcloud31
    volumes:
      - app31_html:/var/www/html
      - ..:/var/www/html/custom_apps/nextfleet
    depends_on:
      db:
        condition: service_healthy

  # Runs cron.php every five minutes on app's install, so reminders fire without a page load.
  cron:
    image: nextcloud:34-apache
    restart: unless-stopped
    entrypoint: /cron.sh
    volumes:
      - app_html:/var/www/html
      - ..:/var/www/html/custom_apps/nextfleet
    depends_on:
      db:
        condition: service_healthy

  # Each install needs its own runner (docs/development.md#local-dev-environment).
  cron31:
    image: nextcloud:31-apache
    restart: unless-stopped
    entrypoint: /cron.sh
    volumes:
      - app31_html:/var/www/html
      - ..:/var/www/html/custom_apps/nextfleet
    depends_on:
      db:
        condition: service_healthy

  # SMTP sink. Nothing leaves the machine; the digest is read at http://localhost:8025.
  mail:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"

volumes:
  db:
  app_html:
  app31_html:
