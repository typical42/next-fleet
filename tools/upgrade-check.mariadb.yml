# MariaDB under tools/upgrade-check.compose.yml: one server, a schema per install.

x-mariadb: &mariadb
  MYSQL_HOST: db
  MYSQL_USER: nextcloud
  MYSQL_PASSWORD: nextcloud

services:
  db:
    image: mariadb:11
    command: --transaction-isolation=READ-COMMITTED
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: nextcloud
      MARIADB_USER: nextcloud
      MARIADB_PASSWORD: nextcloud
    volumes:
      - ../.docker/db-init/10-app31.sql:/docker-entrypoint-initdb.d/10-app31.sql:ro
      - ./upgrade-check.mariadb.sql:/docker-entrypoint-initdb.d/20-nextcloud35.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  app35:
    environment:
      <<: *mariadb
      MYSQL_DATABASE: nextcloud35

  app34:
    environment:
      <<: *mariadb
      MYSQL_DATABASE: nextcloud

  app31:
    environment:
      <<: *mariadb
      MYSQL_DATABASE: nextcloud31

  from34:
    environment:
      <<: *mariadb
      MYSQL_DATABASE: nextcloud34to35

  to35:
    environment:
      <<: *mariadb
      MYSQL_DATABASE: nextcloud34to35
