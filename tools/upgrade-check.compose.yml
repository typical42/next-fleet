# The throwaway servers tools/upgrade-check.sh installs the package on. Its own project, its own
# volumes, no ports and no bind mount of the tree: the app arrives the way a user's does, as the
# tarball, and the dev servers in .docker/compose.yml are never touched.

name: nextfleet-upgrade-check

x-nextcloud: &nextcloud
  environment: &nextcloud-env
    MYSQL_HOST: db
    MYSQL_USER: nextcloud
    MYSQL_PASSWORD: nextcloud
    NEXTCLOUD_TRUSTED_DOMAINS: localhost
    NEXTCLOUD_ADMIN_USER: admin
    NEXTCLOUD_ADMIN_PASSWORD: admin
  # As in .docker/compose.yml: Apache answers before the install has finished, status.php
  # does not.
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost/status.php | grep -q '\"installed\":true'"]
    interval: 10s
    timeout: 5s
    retries: 60
    start_period: 30s
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: mariadb:11
    command: --transaction-isolation=READ-COMMITTED
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: nextcloud
      MARIADB_USER: nextcloud
      MARIADB_PASSWORD: nextcloud
    volumes:
      - ../.docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  app34:
    <<: *nextcloud
    image: nextcloud:34-apache
    environment:
      <<: *nextcloud-env
      MYSQL_DATABASE: nextcloud

  app31:
    <<: *nextcloud
    image: nextcloud:31-apache
    environment:
      <<: *nextcloud-env
      MYSQL_DATABASE: nextcloud31
