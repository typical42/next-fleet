# Oracle under tools/upgrade-check.compose.yml: one schema, so only the paths that reach NC 35,
# one server at a time (docs/development.md#release). The image cannot install on Oracle by
# itself, so the script installs a new one; to35 upgrades the install from34 left, as elsewhere.

x-oracle: &oracle
  # Not installed yet when it is up; the script installs it.
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost/status.php"]

services:
  db:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: nextcloud
      APP_USER_PASSWORD: nextcloud
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # to35 is the same image, which the script builds with app35 and does not build again.
  app35: &oracle35
    <<: *oracle
    build:
      context: ../.docker/oracle
      args:
        NEXTCLOUD: 35
    image: nextfleet-oracle-app:35

  from34:
    <<: *oracle
    build:
      context: ../.docker/oracle
      args:
        NEXTCLOUD: 34
    image: nextfleet-oracle-app:34

  to35: *oracle35
