# The matrix docs/development.md#testing describes. Four supported Nextcloud majors times
# every PHP version times three databases is dozens of jobs, so the trim happens on the PHP
# and database axes - never on Nextcloud, because that is the axis users actually vary.

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Monday, 04:30 UTC.
    - cron: '30 4 * * 1'

# A compromised action owns the release (docs/security.md#supply-chain), so the token can
# only read and every `uses` below names a commit, not a tag that can move under it.
permissions:
  contents: read

# head_ref is set on a pull request and empty everywhere else, so pushing again to a branch
# under review cancels the run it supersedes and nothing else is ever cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  static:
    name: php-cs-fixer, psalm, composer audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The version composer.json pins its resolution platform to, so the analysis sees the
      # oldest PHP the app claims and php-cs-fixer stays quiet about the gap.
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.1'
          coverage: none

      - run: composer install --no-progress
      - run: composer run lint
      - run: composer audit --locked

      # openapi.json is generated from the OCS controllers and committed as the client's
      # contract (docs/api.md), so a change that forgets to regenerate it fails here.
      - name: openapi.json is current
        run: |
          composer run openapi
          git diff --exit-code -- openapi.json

  frontend:
    name: eslint, stylelint, tsc, vitest, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

      # Behind UTC all year, so a spec that mixes local and UTC dates fails here.
      - name: npm test, in Los Angeles
        env:
          TZ: America/Los_Angeles
        run: npm test

      - run: npm run build

      # Build plugins are dev packages the lock file cannot follow into the bundle, so the
      # bundle's own .license files are read, which only exist here.
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.1'
          coverage: none
      - run: composer install --no-progress
      - run: php vendor/bin/phpunit --fail-on-skipped --filter LicensingTest

      # Only the bundle ships, so only its packages gate. The dev tools' advisories have no
      # upstream fix or need a major upgrade of @nextcloud/eslint-config.
      - run: npm audit --omit=dev --audit-level moderate

  e2e:
    name: Playwright and axe, NC 31 and NC 34
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # An unbuilt js/ leaves the Vue root empty, which reads as a broken app, not a missing build.
      - run: npm run build

      # A runner has root, so the browser's system libraries install here. Locally they do
      # not, which is what npm run test:e2e:docker is for.
      - run: npx playwright install --with-deps chromium

      # --wait waits for the install through each app's status.php healthcheck. Mailpit holds
      # the reminder digest tests/e2e/m4-slice.spec.js reads.
      - name: Start both majors
        run: docker compose -f .docker/compose.yml up -d --wait app app31 mail

      - name: Enable the app and seed the demo fleet on both majors
        run: |
          for service in app app31; do
            docker compose -f .docker/compose.yml exec -T -u www-data "$service" php occ app:enable nextfleet
            # Its modal covers the page on a fresh install, and Playwright waits out the
            # whole timeout without ever naming what intercepted the click.
            docker compose -f .docker/compose.yml exec -T -u www-data "$service" php occ app:disable firstrunwizard
            # The fixture tests/e2e/demo-fleet.spec.js reads: the rows that are awkward to
            # make by hand, written through the services a request writes through.
            docker compose -f .docker/compose.yml exec -T -u www-data "$service" php occ nextfleet:seed admin
          done

      - run: npm run test:e2e

      # The runner is gone once the job ends, and a red spec is read from its trace and
      # error-context.md (playwright.config.js keeps them on failure), not from the log.
      - name: Keep Playwright's evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 5

  # The job above meets 31 and 34. A component the bundle needs that 32 or 33 lacks would reach
  # users unseen, so weekly the two majors between load the app and take a vehicle and a reading.
  e2e-weekly:
    name: Playwright smoke, NC 32 and NC 33
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    # Three minutes of specs after a cold install; a stalled one should not hold the runner.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium

      - name: Start both majors
        run: docker compose -f .docker/weekly/compose.yml up -d --wait

      - name: Enable the app on both majors
        run: |
          for service in app32 app33; do
            docker compose -f .docker/weekly/compose.yml exec -T -u www-data "$service" php occ app:enable nextfleet
            docker compose -f .docker/weekly/compose.yml exec -T -u www-data "$service" php occ app:disable firstrunwizard
          done

      - name: The gate and the M1 slice
        env:
          NEXTFLEET_URL_NC32: http://localhost:8032
          NEXTFLEET_URL_NC33: http://localhost:8033
        # The files first: `--project` takes every word after it as a project name.
        run: npx playwright test tests/e2e/m0-gate.spec.js tests/e2e/m1-slice.spec.js --project nc32 --project nc33

  # The one test of what users keep across a release, weekly so a break shows that week.
  upgrade:
    name: Upgrade check from ${{ matrix.base }}, ${{ matrix.db }}
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    # A run takes about ten minutes; a hung `occ upgrade` should not hold the runner for six hours.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        db: [mariadb, pgsql]
        # The two versions a user may run from source: 0.2.0 and 0.3.0. Once a release is out,
        # its tag replaces them.
        base: [9056da5, e7bdbe1]
    steps:
      # The base version is a commit, and the script builds it in a worktree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm run package

      - name: Install fresh and over the base version
        env:
          DB: ${{ matrix.db }}
          BASE: ${{ matrix.base }}
        run: npm run upgrade-check -- --db "$DB" build/artifacts/nextfleet-*.tar.gz "$BASE"

  # Oracle needs oci8, which no official image carries, so it runs on its own stack
  # (docs/development.md#oracle) and weekly only: the build fetches Oracle's client.
  oracle:
    name: NC 34 on Oracle
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    # A cold run builds, starts Oracle and runs the suite in about 15 minutes; a stalled start
    # should not hold the runner for GitHub's six hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.1'
          coverage: none

      # The stack mounts the checkout as the app, vendor/ included.
      - run: composer install --no-progress

      - name: Start the stack
        run: docker compose -f .docker/oracle/compose.yml up -d --build --wait

      - name: Install Nextcloud on Oracle, enable the app, seed
        run: |
          docker compose -f .docker/oracle/compose.yml exec -T -u www-data app php occ maintenance:install --database=oci --database-host=oracle --database-name=FREEPDB1 \
            --database-user=nextcloud --database-pass=nextcloud --admin-user=admin --admin-pass=admin
          docker compose -f .docker/oracle/compose.yml exec -T -u www-data app php occ app:enable nextfleet
          docker compose -f .docker/oracle/compose.yml exec -T -u www-data app php occ nextfleet:seed admin

      # www-data cannot write to the runner's checkout, where the result cache would go.
      - name: Test against the server
        run: >-
          docker compose -f .docker/oracle/compose.yml exec -T -u www-data
          -w /var/www/html/custom_apps/nextfleet app
          php vendor/bin/phpunit -c phpunit.integration.xml --do-not-cache-result

      - name: Container logs
        if: failure()
        run: docker compose -f .docker/oracle/compose.yml logs --no-color

  reuse:
    name: reuse lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The half tests/Unit/LicensingTest.php cannot cover: a REUSE.toml entry gone stale.
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  plan:
    name: Pick the matrix
    runs-on: ubuntu-24.04
    env:
      # The oldest combination is where breakage hides, so it belongs on every pull request
      # rather than in a nightly nobody reads. SQLite is what a first try runs on, and it
      # accepts the least.
      ON_PULL_REQUEST: >-
        [{"nextcloud": "stable31", "php": "8.1", "db": "mariadb"},
         {"nextcloud": "stable34", "php": "8.5", "db": "mariadb"},
         {"nextcloud": "stable34", "php": "8.5", "db": "sqlite"}]

      # Merging adds the database a pull request skips.
      ON_PUSH: >-
        [{"nextcloud": "stable31", "php": "8.1", "db": "mariadb"},
         {"nextcloud": "stable34", "php": "8.5", "db": "mariadb"},
         {"nextcloud": "stable34", "php": "8.5", "db": "pgsql"},
         {"nextcloud": "stable34", "php": "8.5", "db": "sqlite"}]

      # Every major against every PHP it accepts, plus both ends of the range on the other
      # two databases. Allowed to fail loudly - see continue-on-error below.
      ON_SCHEDULE: >-
        [{"nextcloud": "stable31", "php": "8.1", "db": "mariadb"},
         {"nextcloud": "stable31", "php": "8.2", "db": "mariadb"},
         {"nextcloud": "stable31", "php": "8.3", "db": "mariadb"},
         {"nextcloud": "stable31", "php": "8.4", "db": "mariadb"},
         {"nextcloud": "stable32", "php": "8.1", "db": "mariadb"},
         {"nextcloud": "stable32", "php": "8.2", "db": "mariadb"},
         {"nextcloud": "stable32", "php": "8.3", "db": "mariadb"},
         {"nextcloud": "stable32", "php": "8.4", "db": "mariadb"},
         {"nextcloud": "stable33", "php": "8.2", "db": "mariadb"},
         {"nextcloud": "stable33", "php": "8.3", "db": "mariadb"},
         {"nextcloud": "stable33", "php": "8.4", "db": "mariadb"},
         {"nextcloud": "stable33", "php": "8.5", "db": "mariadb"},
         {"nextcloud": "stable34", "php": "8.2", "db": "mariadb"},
         {"nextcloud": "stable34", "php": "8.3", "db": "mariadb"},
         {"nextcloud": "stable34", "php": "8.4", "db": "mariadb"},
         {"nextcloud": "stable34", "php": "8.5", "db": "mariadb"},
         {"nextcloud": "stable31", "php": "8.1", "db": "pgsql"},
         {"nextcloud": "stable31", "php": "8.1", "db": "sqlite"},
         {"nextcloud": "stable34", "php": "8.5", "db": "pgsql"},
         {"nextcloud": "stable34", "php": "8.5", "db": "sqlite"}]
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      # jq wraps the list in the object `strategy.matrix` expects, on the one line an output can
      # carry. Assigned on its own, not inside `echo`, so a broken list fails here rather than
      # in `fromJson` two jobs later.
      - id: select
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) combinations="$ON_PULL_REQUEST" ;;
            schedule) combinations="$ON_SCHEDULE" ;;
            *) combinations="$ON_PUSH" ;;
          esac
          matrix=$(jq -c '{include: .}' <<< "$combinations")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  server:
    name: NC ${{ matrix.nextcloud }}, PHP ${{ matrix.php }}, ${{ matrix.db }}
    needs: plan
    runs-on: ubuntu-24.04
    # No `continue-on-error` for the weekly run: nothing waits on it, and continue-on-error
    # concludes green, which tells nobody.
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    services:
      # Both start on every combination: a service cannot be declared conditionally, and
      # the install step below uses only the one `matrix.db` names.
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      # The SMTP sink the dev stack runs as `mail`; the integration suite reads what it caught.
      mailpit:
        image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      # The server carries its dependencies in the 3rdparty submodule, so a checkout with
      # submodules is a runnable Nextcloud and needs no composer install of its own.
      - name: Check out Nextcloud
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nextcloud/server
          ref: ${{ matrix.nextcloud }}
          submodules: true

      - name: Check out the app where the server looks for it
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: apps/nextfleet

      # The app's notices are stored, counted and read back through it. A release and the image
      # ship it; a checkout of the server does not.
      - name: Check out the notifications app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nextcloud/notifications
          ref: ${{ matrix.nextcloud }}
          path: apps/notifications

      # apcu: the dev stack's image caches in it, and the import and OwnFiles remember through
      # the cache. gmp: the notifications app's web-push dependencies require it.
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: apcu, bcmath, ctype, curl, dom, fileinfo, gd, gmp, iconv, intl, mbstring, openssl, pdo_mysql, pdo_pgsql, pdo_sqlite, posix, sqlite3, xml, zip
          ini-values: apc.enable_cli=1
          coverage: none

      - name: Install the app's dependencies
        working-directory: apps/nextfleet
        run: composer install --no-progress

      # On 34 its lib/ uses web-push classes this builds into lib/Vendor, and without them the
      # app fails to load; before 34 it installs nothing. Before the install, which enables the
      # app by default.
      - name: Install the notifications app's dependencies
        working-directory: apps/notifications
        run: composer install --no-dev --no-progress

      - name: Install Nextcloud
        env:
          DB: ${{ matrix.db }}
        run: |
          case "$DB" in
            mariadb) args=(--database=mysql --database-host=127.0.0.1 --database-port=3306 --database-name=nextcloud --database-user=root --database-pass=root) ;;
            pgsql) args=(--database=pgsql --database-host=127.0.0.1 --database-port=5432 --database-name=nextcloud --database-user=postgres --database-pass=postgres) ;;
            sqlite) args=(--database=sqlite --database-name=nextcloud) ;;
            *) echo "no such database: $DB" >&2; exit 1 ;;
          esac
          php occ maintenance:install --admin-user=admin --admin-pass=admin "${args[@]}"

      # What the Nextcloud image makes of the dev stack's SMTP_* and MAIL_* (.docker/compose.yml).
      - name: Send mail through Mailpit
        run: |
          php occ config:system:set mail_smtpmode --value=smtp
          php occ config:system:set mail_smtphost --value=localhost
          php occ config:system:set mail_smtpport --value=1025 --type=integer
          php occ config:system:set mail_from_address --value=nextfleet
          php occ config:system:set mail_domain --value=example.org

      # As the dev stack's image sets it. With no distributed cache set, Nextcloud uses this one.
      - name: Cache in APCu
        run: php occ config:system:set memcache.local --value='\OC\Memcache\APCu'

      # The install has enabled it by default already; said here, the suite's need of it is too.
      - name: Enable the notifications app
        run: php occ app:enable notifications

      # The migration runs here, and a class the server refuses takes the whole app down
      # with it - see tests/Unit/MigrationsTest.php.
      - name: Enable the app
        run: php occ app:enable nextfleet

      # docs/development.md#testing. Weekly only: the app store is a download.
      - name: Install user_migration
        if: github.event_name == 'schedule'
        run: php occ app:install user_migration

      - name: Test
        working-directory: apps/nextfleet
        run: composer run test

      # Both suites below call the server over HTTP; PHP's own web server lives until the job
      # ends. One worker serves one request at a time and the API suite's race would never meet,
      # so it gets four.
      - name: Serve Nextcloud
        env:
          PHP_CLI_SERVER_WORKERS: 4
        run: |
          php -S localhost:8080 > "$RUNNER_TEMP/php-server.log" 2>&1 &
          timeout 30 sh -c 'until curl -fsS http://localhost:8080/status.php > /dev/null; do sleep 1; done'

      # The unit suite mocks the database away, so this is the only job that measures the
      # schema against a real one - and the only place the app meets postgres and sqlite.
      - name: Test against the server
        working-directory: apps/nextfleet
        env:
          NEXTCLOUD_ROOT: ${{ github.workspace }}
          NEXTFLEET_SERVER_URL: http://localhost:8080
          NEXTFLEET_MAILPIT_URL: http://localhost:8025
        run: composer run test:integration

      - name: Test as a client
        working-directory: apps/nextfleet
        env:
          NEXTCLOUD_ROOT: ${{ github.workspace }}
          NEXTFLEET_API_URL: http://localhost:8080
        run: composer run test:api
